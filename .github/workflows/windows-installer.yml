name: Windows x64 installer

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-installer]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.24.0'
      - name: Prepare Rust and JavaScript dependencies
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
      - name: Build offline installer
        run: pnpm build:windows
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: EasyStream-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
